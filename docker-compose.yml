services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hackerone-web
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      - DB_PATH=/app/data/bounties.db
      - RECON_AGENT_URL=http://127.0.0.1:5001
    volumes:
      - bounty_data:/app/data
      - /tmp:/host-tmp:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  bounty_data:
